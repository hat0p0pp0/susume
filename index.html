<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="すゝめ｜学びの冒険に、いざ出発。自分の型を知り、師匠と仲間に会いに行く学び直しRPG（モック）">
<meta name="theme-color" content="#14152A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="すゝめ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>すゝめ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F5FA;--sheet:#FFFFFF;--ink:#191B2E;--ink2:#62657A;--line:#E3E4EE;--chip:#EEEFF6;--shu:#3D5AFE;--ha:#FF3D7F;--ri:#0DAA7B;--yell:#F59E0B;--shu-t:rgba(61,90,254,.16);--ha-t:rgba(255,61,127,.12);--ri-t:rgba(13,170,123,.14);--seed:#9A6B45;--shadow:#191B2E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12131D;--sheet:#1C1E2B;--ink:#F3F3FA;--ink2:#A3A6BA;--line:#2F3244;--chip:#262939;--shu:#8093FF;--ha:#FF6FA0;--ri:#3DD6A3;--yell:#FFBF4D;--shu-t:rgba(128,147,255,.2);--ha-t:rgba(255,111,160,.15);--ri-t:rgba(61,214,163,.16);--seed:#C99A72;--shadow:#000;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#12131D;--sheet:#1C1E2B;--ink:#F3F3FA;--ink2:#A3A6BA;--line:#2F3244;--chip:#262939;--shu:#8093FF;--ha:#FF6FA0;--ri:#3DD6A3;--yell:#FFBF4D;--shu-t:rgba(128,147,255,.2);--ha-t:rgba(255,111,160,.15);--ri-t:rgba(61,214,163,.16);--seed:#C99A72;--shadow:#000;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);padding-bottom:110px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);display:flex;align-items:center;gap:8px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:6px;font-weight:800;font-size:20px;letter-spacing:.02em;white-space:nowrap}
.brand svg{width:28px;height:28px}
.brand .owl .eyes{animation:none}
.top-r{margin-left:auto;display:flex;gap:6px;align-items:center}
.top select{font-size:12px;border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 10px;max-width:104px;font-weight:700}
.mode{font-size:12px;border:2px solid var(--ink);background:var(--yell);color:#191B2E;border-radius:999px;padding:5px 11px;font-weight:800;box-shadow:2px 2px 0 var(--shadow);white-space:nowrap}
.icon{border:0;background:var(--sheet);width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;color:var(--ink);display:grid;place-items:center;padding:0 0 3px;border:1.5px solid var(--line)}
.tabs{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;z-index:30;background:var(--sheet);border:2px solid var(--ink);border-radius:24px;box-shadow:3px 3px 0 var(--shadow);display:grid;grid-template-columns:repeat(5,1fr);padding:6px}
.tabs button{border:0;background:none;padding:6px 0;font-size:10.5px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:16px;font-weight:700}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ha);background:var(--ha-t)}
main{padding:0 0 8px}
.pad{padding:0 16px}
h1,h2,h3{font-weight:800;line-height:1.35;margin:0}
h1{font-size:26px;margin:8px 16px 6px}
h2{font-size:18px;margin:26px 16px 10px}
h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 8px}
.lead{color:var(--ink2);margin:0 16px 12px;font-size:14px}
.sheet{background:var(--sheet);border:1.5px solid var(--line);border-radius:22px;padding:18px;margin:10px 16px}
.pop{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--ink2);font-size:13px}
.small{font-size:12px}
.btn{border:2px solid var(--ink);border-radius:999px;padding:12px 20px;background:var(--ink);color:var(--paper);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.full{width:100%}
.btn.big{padding:16px 22px;font-size:17px}
.btn.ha{background:var(--ha);color:#fff}
.btn.ri{background:var(--ri);color:#fff}
.btn.ghost{background:var(--sheet);color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:13px;box-shadow:2px 2px 0 var(--shadow)}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.stack>*+*{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);transition:transform .08s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on::before{content:'✓ '}
.chip.shu.on{background:var(--shu);border-color:var(--shu);color:#fff}
.chip.ha.on{background:var(--ha);border-color:var(--ha);color:#fff}
.chip.ri.on{background:var(--ri);border-color:var(--ri);color:#fff}
.chip.shu.on::before,.chip.ha.on::before,.chip.ri.on::before{content:''}
.tag{display:inline-block;font-size:11px;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--ink2);white-space:nowrap;font-weight:700}
.tag.ha{background:var(--ha-t);color:var(--ha)}
.tag.shu{background:var(--shu-t);color:var(--shu)}
.tag.ri{background:var(--ri-t);color:var(--ri)}
.tag.yell{background:rgba(245,158,11,.16);color:var(--yell)}
.seg{display:flex;margin:6px 16px 4px;gap:6px;overflow-x:auto;padding:2px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 10px;font-size:13px;white-space:nowrap;color:var(--ink2);font-weight:700}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.flower{display:block;margin:0 auto;max-width:100%;height:auto}
.flower .lbl{font-size:11px;fill:var(--ink2);font-family:inherit;font-weight:700}
.flower .side{font-size:13px;font-weight:800;fill:var(--ink)}
.flower .guide{fill:none;stroke:var(--line);stroke-width:1}
.flower .guide.mid{stroke-dasharray:3 4}
.p-shu{fill:var(--shu-t);stroke:var(--shu);stroke-width:1.8;stroke-linejoin:round}
.p-ha{fill:var(--ha-t);stroke:var(--ha);stroke-width:1.6;stroke-dasharray:5 3}
.p-ri{fill:none;stroke:var(--ri);stroke-width:2.4;stroke-linejoin:round}
.p-fr{fill:none;stroke:var(--ha);stroke-width:2}
.ri-band{fill:var(--ri-t);opacity:.6}
.bloom .p-shu,.bloom .p-ha{transform-box:view-box;transform-origin:0 0;animation:bloom .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes bloom{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:6px 0 0;font-weight:700}
.legend i{display:inline-block;width:14px;height:10px;border-radius:5px;margin-right:4px;vertical-align:middle}
.meter{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.meter>span{display:block;height:100%;background:var(--shu);border-radius:4px}
.meter.ha>span{background:var(--ha)}
.meter.ri>span{background:var(--ri)}
.meter.yell>span{background:var(--yell)}
.axis{padding:14px 0;border-top:1.5px dashed var(--line)}
.axis:first-child{border-top:0;padding-top:0}
.axis .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);font-weight:700}
.track{position:relative;height:22px;margin:4px 0}
.track .base{position:absolute;left:0;right:0;top:10px;height:3px;background:var(--line);border-radius:2px}
.track .band{position:absolute;top:4px;height:14px;background:var(--ri-t);border-radius:7px}
.track .arrow{position:absolute;top:10px;height:3px;background:var(--ha)}
.track .goal{position:absolute;top:0;width:6px;height:22px;margin-left:-3px;border-radius:3px;background:var(--ri)}
.track .dot{position:absolute;top:3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--shu);border:3px solid var(--sheet);box-shadow:0 0 0 1.5px var(--shu)}
.track .dot.fr{background:var(--ha);box-shadow:0 0 0 1.5px var(--ha)}
.track-key{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2);font-weight:700;margin-bottom:10px}
.track-key i{display:inline-block;vertical-align:middle;margin-right:4px}
input[type=range]{width:100%;accent-color:var(--ri)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 16px}
.pair .sheet{margin:0}
.card-shu{background:linear-gradient(var(--shu-t),var(--shu-t)),var(--sheet);border-color:transparent}
.card-ha{background:linear-gradient(var(--ha-t),var(--ha-t)),var(--sheet);border-color:transparent}
.card-ri{background:linear-gradient(var(--ri-t),var(--ri-t)),var(--sheet);border-color:transparent}
.card-shu h3{color:var(--shu)}.card-ha h3{color:var(--ha)}.card-ri h3{color:var(--ri)}
.kv{list-style:none;padding:0;margin:0}
.kv li{padding:7px 0;border-top:1.5px dashed var(--line);font-size:14px}
.kv li:first-child{border-top:0}
.kv b{display:block;font-size:11px;color:var(--ink2);font-weight:700}
.hist{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.hist figure{margin:0;text-align:center;min-width:92px}
.hist figcaption{font-size:11px;color:var(--ink2);font-weight:700}
.srl{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:4px;margin:6px 16px 4px}
.srl>i{font-style:normal;color:var(--ink2);font-weight:800}
.srl-i{border-radius:18px;padding:10px 6px;text-align:center;color:#fff;display:flex;flex-direction:column;line-height:1.3}
.srl-i b{font-size:24px;font-weight:800}
.srl-i span{font-size:12px;font-weight:800}
.srl-i small{font-size:10px;opacity:.9}
.srl-i.shu{background:var(--shu)}.srl-i.ha{background:var(--ha)}.srl-i.ri{background:var(--ri)}
.qdots{display:flex;gap:6px;justify-content:center;margin:4px 16px 0;flex-wrap:wrap}
.qdots button{width:22px;height:8px;border-radius:4px;border:0;background:var(--line);padding:0}
.qdots button.done{background:var(--ri)}
.qdots button.cur{background:var(--ink);width:32px}
.qcard{text-align:center;padding:26px 18px}
.qtext{font-size:19px;font-weight:800;line-height:1.55;margin:12px 0 22px;min-height:88px;display:flex;align-items:center;justify-content:center}
.scale{display:flex;justify-content:space-between;align-items:center;gap:4px}
.scale button{border:2.5px solid var(--line);background:var(--sheet);border-radius:50%;padding:0;transition:transform .1s;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.scale button:active{transform:scale(.9)}
.scale button.l{border-color:var(--shu)}
.scale button.r{border-color:var(--ha)}
.scale button.on{background:var(--ink);border-color:var(--ink)}
.scale button.l.on{background:var(--shu);border-color:var(--shu)}
.scale button.r.on{background:var(--ha);border-color:var(--ha)}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:8px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px dashed var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.opt:first-of-type{border-top:0}
.opt .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px}
.opt.on .box{background:var(--ha);border-color:var(--ha);color:#fff}
.opt .grow{flex:1}
.bar{height:6px;background:var(--chip);border-radius:3px;margin-top:5px}
.bar span{display:block;height:100%;background:var(--ha);border-radius:3px}
.mandala{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 16px}
.mandala .qd{border-radius:22px;padding:14px;font-size:13px;min-height:130px}
.mandala .qd b{display:block;font-size:13px;margin-bottom:4px;font-weight:800}
.mandala .q1{background:var(--shu-t);padding-right:46px;padding-bottom:40px}
.mandala .q2{background:var(--ri-t);padding-left:46px;padding-bottom:40px;text-align:right}
.mandala .q3{background:rgba(245,158,11,.16);padding-right:46px;padding-top:40px}
.mandala .q4{background:var(--ha-t);padding-left:46px;padding-top:40px;text-align:right}
.mandala .q1 b{color:var(--shu)}.mandala .q2 b{color:var(--ri)}.mandala .q3 b{color:var(--yell)}.mandala .q4 b{color:var(--ha)}
.mandala .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;text-align:center;font-weight:800;font-size:14px;line-height:1.3;padding:8px;border:5px solid var(--paper)}
.list-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1.5px dashed var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list-item:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
img.av{object-fit:cover;background:var(--chip);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--line)}
.photo-edit{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.photo-edit label{cursor:pointer}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:6px;margin:8px 0;align-items:center}
.dots i{width:24px;height:24px;border-radius:50%;border:2px dashed var(--line)}
.dots i.on{background:var(--ha);border:2px solid var(--ink)}
.price{width:100%;border-collapse:collapse;font-size:13px}
.price td{padding:6px 0;border-top:1.5px dashed var(--line)}
.price td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.price tr.now td{font-weight:800;color:var(--ha)}
.price tr.total td{border-top:2px solid var(--ink);font-weight:800;font-size:15px}
.callout{background:var(--ha-t);padding:10px 14px;border-radius:14px;font-size:14px;margin:10px 0;font-weight:700}
.callout.ri{background:var(--ri-t)}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;font-size:34px;line-height:1;color:var(--line);padding:0 2px}
.stars button.on{color:var(--yell)}
textarea,input[type=text],input[type=search],select.field,input[type=number]{width:100%;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:10px 12px}
textarea{min-height:72px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px;font-weight:700}
.hero{padding:4px 16px 0;text-align:center}
.hero h1{margin:18px 0 10px;font-size:26px;line-height:1.35}
.hero-card{background:var(--sheet);border-radius:28px;padding:20px 12px 16px;position:relative}
.stickers{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.stk{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;color:#fff;border:2px solid var(--ink)}
.stk.shu{background:var(--shu);transform:rotate(-4deg)}.stk.ha{background:var(--ha);transform:rotate(3deg)}.stk.ri{background:var(--ri);transform:rotate(-2deg)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:10px 0;border-top:1.5px dashed var(--line);align-items:flex-start}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);font-weight:800;font-size:15px;background:var(--ha);color:#fff;width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 16px}
.tile{background:var(--sheet);border:1.5px solid var(--line);border-radius:20px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center}
.tile b{font-size:22px;font-weight:800;line-height:1.2}
.tile span{font-size:11px;color:var(--ink2);font-weight:700}
.tile:active{transform:scale(.96)}
.bignum{font-size:34px;font-weight:800;line-height:1.1}
.bignum small{font-size:15px}
.mission{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1.5px dashed var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.mission:first-child{border-top:0}
.mission .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.mission.done .ck{background:var(--ri);border-color:var(--ri)}
.mission.done .grow{text-decoration:line-through;color:var(--ink2)}
.bookrow{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--chip);border-radius:14px}
.icon-x{border:0;background:var(--sheet);width:26px;height:26px;border-radius:50%;flex:none;color:var(--ink2);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13px;z-index:50;max-width:90%;text-align:center;font-weight:700;animation:pop .25s ease both}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.modal{position:fixed;inset:0;background:rgba(18,19,29,.55);z-index:60;display:grid;place-items:center;padding:20px}
.modal .sheet{max-width:340px;width:100%;text-align:center;margin:0}
.grow-anim{animation:growup 1.2s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 100%}
@keyframes growup{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.qr{display:grid;grid-template-columns:repeat(11,1fr);width:132px;height:132px;margin:10px auto;gap:1px}
.qr i{background:var(--ink);border-radius:1px}
.qr i.o{background:transparent}
.tbl-wrap{overflow-x:auto}
.post{padding:12px 0;border-top:1.5px dashed var(--line)}
.post:first-child{border-top:0}
.odai{background:var(--ha);color:#fff;border-radius:22px;padding:16px 18px;margin:10px 16px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--shadow)}
.odai b{font-size:17px;display:block;margin-top:2px;font-weight:800}
.lecmode{background:var(--yell);color:#191B2E;font-weight:800}

.hscroll{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 10px;scroll-snap-type:x mandatory;scroll-padding-inline:16px}
.hscroll>*{scroll-snap-align:start;flex:none}
.profile{margin:8px 16px 10px;border-radius:26px;padding:18px;background:var(--sheet);position:relative;overflow:hidden}
.profile::before{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--ha-t)}
.profile::after{content:'';position:absolute;right:40px;top:70px;width:70px;height:70px;border-radius:50%;background:var(--shu-t)}
.profile>*{position:relative;z-index:1}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;text-align:center}
.pstats div{background:var(--chip);border-radius:14px;padding:8px 4px}
.pstats b{display:block;font-size:18px;line-height:1.2}
.pstats span{font-size:11px;color:var(--ink2);font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 16px}
.kpi{background:var(--sheet);border:1.5px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left}
.kpi .lbl{font-size:12px;color:var(--ink2);font-weight:700}
.kpi .num{font-size:26px;font-weight:800;line-height:1.1}
.kpi .num small{font-size:13px}
.kpi.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kpi.dark .lbl{color:var(--paper);opacity:.75}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}
.heat i{width:100%;aspect-ratio:1;border-radius:4px;background:var(--chip)}
.heat i.h1{background:var(--ri);opacity:.35}.heat i.h2{background:var(--ri);opacity:.65}.heat i.h3{background:var(--ri)}
.tierstep{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tierstep div{border-radius:14px;padding:10px 6px;text-align:center;background:var(--chip);font-size:11px;font-weight:700;color:var(--ink2)}
.tierstep div b{display:block;font-size:14px;color:var(--ink)}
.tierstep div.on{background:var(--ha);color:#fff}
.tierstep div.on b{color:#fff}
.friend-tile{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;border:0;background:none;padding:0;font-size:11px;font-weight:700}
.friend-tile .plus{width:52px;height:52px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:22px;color:var(--ink2)}
details.sheet summary{font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.sheet summary::after{content:'＋';color:var(--ink2)}
details.sheet[open] summary::after{content:'－'}
details.sheet[open] summary{margin-bottom:8px}
.evcard{display:flex;gap:12px;padding:12px 0;border-top:1.5px dashed var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;align-items:stretch}
.evcard:first-child{border-top:0}
.evdate{width:58px;flex:none;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--chip);line-height:1.15;padding:6px 0}
.evdate b{font-size:22px;font-weight:800}
.evdate small{font-size:10px;font-weight:700;color:var(--ink2)}
.evdate.ha{background:var(--ha-t)}.evdate.ha b{color:var(--ha)}
.evdate.shu{background:var(--shu-t)}.evdate.shu b{color:var(--shu)}
.evdate.yell{background:rgba(245,158,11,.16)}.evdate.yell b{color:var(--yell)}
.evtitle{display:block;margin:4px 0 2px;font-size:15px;line-height:1.4}
.nexthero{margin:10px 16px;border-radius:26px;padding:18px;background:var(--shu);color:#fff;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--shadow);display:block;width:calc(100% - 32px);text-align:left}
.nexthero .cd{font-size:40px;font-weight:800;line-height:1}
.nexthero .cd small{font-size:15px}
.nexthero .tag{background:rgba(255,255,255,.22);color:#fff}
.todo{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1.5px dashed var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.todo:first-child{border-top:0}
.todo .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--ink2);font-weight:700}
.cal button{border:0;background:none;border-radius:12px;padding:6px 0 4px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px}
.cal button.has{background:var(--chip)}
.cal button.mine{background:var(--ha-t);color:var(--ha)}
.cal button.sel{background:var(--ink);color:var(--paper)}
.cal button i{width:6px;height:6px;border-radius:50%;background:var(--ink2)}
.cal button.mine i{background:var(--ha)}
.cal button.sel i{background:var(--paper)}
.tcard{background:var(--sheet);border:1.5px solid var(--line);border-radius:24px;margin:12px 16px;overflow:hidden}
.tcard .band{padding:14px 16px 12px;color:#fff}
.tcard .band h3{font-size:19px;margin:2px 0 0;color:#fff}
.tcard .band .small{opacity:.9;font-weight:700}
.tcard .body{padding:12px 16px 16px}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin-bottom:12px}
.tstats div{background:var(--chip);border-radius:12px;padding:6px 2px}
.tstats b{display:block;font-size:17px;line-height:1.2}
.tstats span{font-size:10.5px;color:var(--ink2);font-weight:700}
.stackav{display:flex;align-items:center}
.stackav>*{margin-left:-8px;border:2px solid var(--sheet)!important}
.stackav>*:first-child{margin-left:0}
.qlinks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.qlinks button{border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:8px 2px;font-size:12px;font-weight:800}
.ccard{width:220px;background:var(--sheet);border:1.5px solid var(--line);border-radius:22px;padding:14px;text-align:left}
.ring text{font-family:inherit}
.viewas{position:sticky;top:0;z-index:40;background:var(--yell);color:#191B2E;font-size:12px;font-weight:800;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.viewas button{border:2px solid #191B2E;background:#fff;color:#191B2E;border-radius:999px;padding:3px 10px;font-weight:800;font-size:12px}
.adm-badge{background:var(--ink);color:var(--paper);font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px}
.vbars{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1.5px solid var(--line)}
.vbars div{flex:1;background:var(--shu);border-radius:6px 6px 0 0;min-height:2px;position:relative}
.vbars div span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;font-weight:800;color:var(--ink2)}
.vlabels{display:flex;gap:4px;margin-top:4px}
.vlabels span{flex:1;text-align:center;font-size:10px;color:var(--ink2);font-weight:700}
.hb{display:grid;grid-template-columns:110px 1fr 48px;gap:8px;align-items:center;padding:4px 0;font-size:12px;font-weight:700}
.hb .t{height:12px;background:var(--chip);border-radius:6px;overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:6px}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
.dtable{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.dtable th{text-align:left;color:var(--ink2);font-weight:800;padding:6px 8px;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--sheet)}
.dtable td{padding:7px 8px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.dtable tr[data-act]{cursor:pointer}
.dtable tr[data-act]:hover td{background:var(--chip)}
.form-card label.f{margin-top:14px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13px;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--ha);flex:none;margin-top:2px}
.lcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.lcal .wd{font-size:11px;font-weight:800;color:var(--ink2);padding-bottom:2px}
.lcal .wd.sun{color:var(--ha)}.lcal .wd.sat{color:var(--shu)}
.lc{border:0;border-radius:12px;aspect-ratio:1;background:var(--chip);font-size:13px;font-weight:800;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;position:relative}
.lc small{font-size:9px;font-weight:800;line-height:1}
.lc.h1{background:rgba(13,170,123,.22)}.lc.h2{background:rgba(13,170,123,.5)}.lc.h3{background:var(--ri);color:#fff}
.lc.today{box-shadow:0 0 0 2.5px var(--ink) inset}
.lc.sel{box-shadow:0 0 0 3px var(--ha)}
.lc:disabled{opacity:.3;cursor:default}
.lc.pad{background:none}
.lsum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;text-align:center}
.lsum div{background:var(--chip);border-radius:14px;padding:8px 2px}
.lsum b{display:block;font-size:20px;line-height:1.2}
.lsum span{font-size:10.5px;color:var(--ink2);font-weight:700}
.litem{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1.5px dashed var(--line);font-size:13px}
.litem:first-child{border-top:0}
.litem .ic{width:30px;height:30px;border-radius:10px;background:var(--chip);display:grid;place-items:center;flex:none}
.owl{display:block;flex:none;overflow:visible}
.hero .owl{margin:0 auto}
.owl.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.owl .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.say{display:flex;gap:8px;align-items:flex-end;margin:12px 16px}
.bubble{flex:1;background:var(--sheet);border:2px solid var(--ink);border-radius:22px 22px 22px 6px;padding:13px 15px;box-shadow:3px 3px 0 var(--shadow);font-size:14px;font-weight:700;line-height:1.65}
.bubble .say-t{display:block;font-size:12px;color:var(--ink2);margin-bottom:2px}
.bubble.center{border-radius:22px;text-align:center;margin:10px auto 0;max-width:300px;flex:none}
.statcard{display:flex;align-items:center;gap:10px;width:calc(100% - 32px);text-align:left;cursor:pointer}
.themebar{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 6px;scroll-padding-inline:16px}
.tchip{flex:none;border:2px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;color:var(--ink)}
.tchip.on{background:var(--c);border-color:var(--ink);color:#fff;box-shadow:2px 2px 0 var(--shadow)}
.tchip.add{border-style:dashed;color:var(--ink2);padding:7px 13px}
.cband{margin:8px 16px 4px;border-radius:24px;padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.cband h2{margin:2px 0 4px;color:#fff;font-size:22px}
.cband .small{font-weight:700;opacity:.92}
.cband button{border:2px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;white-space:nowrap}
.menu{background:var(--sheet);border:1.5px solid var(--line);border-radius:22px;margin:10px 16px;overflow:hidden}
.menurow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;background:none;border-top:1.5px dashed var(--line);text-align:left;font-weight:800;font-size:15px;color:var(--ink)}
.menurow:first-child{border-top:0}
.menurow .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--chip)}
.menurow .r{margin-left:auto;color:var(--ink2);font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.menurow .r::after{content:'›';font-size:18px}
.menurow:active{background:var(--chip)}
.avwrap{position:relative;flex:none}
.camera{position:absolute;right:-2px;bottom:-2px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;border:3px solid var(--sheet);cursor:pointer}
.kpi{cursor:pointer}
button.kpi{font:inherit;color:inherit}
.empty{text-align:center;padding:10px 0 4px}
.lockwrap{position:relative;margin-top:6px;border-radius:16px;overflow:hidden}
.locked{filter:blur(6px);pointer-events:none;user-select:none;opacity:.75}
.lockover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-weight:800;font-size:13px;background:linear-gradient(transparent,var(--sheet) 70%);padding:10px}
.price-tag{font-size:38px;font-weight:800;line-height:1}
.price-tag small{font-size:15px}
.incl li{display:flex;gap:10px;align-items:flex-start}
.incl li::before{content:'✓';color:var(--ri);font-weight:800}
.seg2{display:flex;gap:8px}
.lookgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lookopt{background:linear-gradient(#CFE0FF 0 72%,#C9A77C 72%);border:3px solid var(--line);padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;clip-path:var(--n2)}
.lookopt span{font-size:10.5px;font-weight:800;background:var(--sheet);padding:0 4px}
.lookopt.on{border-color:var(--ha);box-shadow:inset 0 0 0 2px var(--ha)}
.anslabel{margin-top:14px;padding:8px 10px;font-weight:800;font-size:14px;color:var(--ink2);background:var(--chip);clip-path:var(--n2)}
.anslabel.set{background:var(--ink);color:#FBBF24}
.anslabel.pop{animation:labelpop .5s ease}
@keyframes labelpop{0%{transform:scale(.9)}40%{transform:scale(1.06)}100%{transform:none}}
.scale button{font-size:16px}
.scale button.popnow{animation:btnpop .45s ease}
@keyframes btnpop{0%{transform:scale(.8)}50%{transform:scale(1.3)}100%{transform:scale(1.1)}}
.scale button.on{transform:scale(1.1)}
.scale{gap:2px}
.qcard.slidein{animation:slidein .28s ease}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.titlelogo{margin:18px 0 10px}
.titlelogo span{display:block;font-size:56px;line-height:1.1;letter-spacing:.08em;color:var(--ink);text-shadow:4px 4px 0 var(--ha-t),-2px -2px 0 var(--shu-t)}
.titlelogo small{display:block;font-weight:800;font-size:15px;margin-top:4px;color:var(--ha)}
.abq{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 18px;text-align:left}
.ab{padding:12px 10px;font-size:14px;font-weight:700;line-height:1.55;clip-path:var(--n4);border:2px solid transparent}
.ab b{display:block;font-family:'DotGothic16',monospace;font-weight:400;font-size:18px;margin-bottom:2px}
.ab.a{background:var(--shu-t)}.ab.a b{color:var(--shu)}
.ab.b{background:var(--ha-t)}.ab.b b{color:var(--ha)}
.ab.a.on{border-color:var(--shu)}.ab.b.on{border-color:var(--ha)}
hr{border:0;border-top:1.5px dashed var(--line);margin:12px 0}
a{color:var(--shu)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== JRPGウィンドウ ===== */

.route{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

V.vote=p=>{const e=ev(p.id),t=TH(e.theme),l=LEC(e.lec);const mv=e.voted[state.persona];const sel=state.ui.vote[e.id]||(mv?{...mv}:{});state.ui.vote[e.id]=sel;['date','format','venue'].forEach(k=>{if(e.opts[k].length===1&&!sel[k])sel[k]=e.opts[k][0].id});
 const lead=k=>[...e.opts[k]].sort((a,b)=>b.v-a.v)[0];const venue=e.opts.venue.find(v=>v.id===sel.venue)||lead('venue');
 const nNext=Math.min(e.joined+3,e.max);const now=perPerson(e,e.joined,venue.fee,me()).total,nxt=perPerson(e,nNext,venue.fee,me()).total;

V.event=p=>{const e=ev(p.id),t=TH(e.theme),l=LEC(e.lec),u=me(),per=state.persona;const head=`<p class="lead" style="margin-top:16px">${esc(t.name)}・${esc(l.name)}</p><h1 style="margin-top:0">${esc(e.title)}</h1><div class="sheet"><ul class="kv"><li><b>日時</b>${esc(e.date)}</li><li><b>形式</b>${esc(e.format)}</li><li><b>場所</b>${esc(e.venue)}</li><li><b>参加者</b>${e.joined}人（最少${e.min}人・最大${e.max}人）</li></ul></div>`;

/* ============ v19：輪郭線つきドット絵エンジン ============ */
const OUTC='#2A1F3D';
function pxGrid(w,h,ox,oy){return{w,h,ox,oy,c:new Array(w*h).fill(null)}}
function gp(G,x,y,w,h,col){for(let j=0;j<h;j++)for(let i=0;i<w;i++){const X=x+i+G.ox,Y=y+j+G.oy;if(X>=0&&Y>=0&&X<G.w&&Y<G.h)G.c[Y*G.w+X]=col}}
function gOutline(G,col=OUTC){const o=G.c.slice();for(let Y=0;Y<G.h;Y++)for(let X=0;X<G.w;X++){if(G.c[Y*G.w+X])continue;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=X+dx,b=Y+dy;if(a>=0&&b>=0&&a<G.w&&b<G.h&&G.c[b*G.w+a]&&G.c[b*G.w+a]!==col){o[Y*G.w+X]=col;break}}}G.c=o}
function gSvg(G,size,cls=''){let r='';for(let Y=0;Y<G.h;Y++){let X=0;while(X<G.w){const col=G.c[Y*G.w+X];if(!col){X++;continue}let L=1;while(X+L<G.w&&G.c[Y*G.w+X+L]===col)L++;r+=`<rect x="${X}" y="${Y}" width="${L}" height="1" fill="${col}"/>`;X+=L}}return`<svg class="pxs ${cls}" viewBox="0 0 ${G.w} ${G.h}" width="${size}" height="${Math.round(size*G.h/G.w)}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`}
function gMap(rows,pal,size,cls=''){const G=pxGrid(rows[0].length+2,rows.length+2,1,1);rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch!=='.')gp(G,x,y,1,1,pal[ch])}));gOutline(G);return gSvg(G,size,cls)}

 <div class="prefrow"><h3>テーマ</h3>${seg('theme',[['auto','端末に合わせる'],['light','ライト'],['dark','ダーク']],'auto')}</div>
 <div class="prefrow"><h3>文字の大きさ</h3>${seg('size',[['std','標準'],['big','大きめ']],'std')}</div>
 <div class="prefrow"><h3>動き</h3>${seg('motion',[['std','標準'],['calm','少なめ']],'std')}</div>
 <div class="prefprev"><b>プレビュー</b><p class="small muted" style="margin:4px 0 0">学びの冒険に、いざ出発。フク老の吹き出しや、ボタンの大きさがこのように変わります。</p></div>
 ${owlSay('見やすい設定が見つかったら、そのまま冒険を続けるのじゃ。',{size:40})}`};
const _cmd0=cmd;cmd=function(l,...a){return _cmd0(String(l).replace(/^▶\s*/,''),...a)};
Object.assign(ACT,{
 back:()=>{if((state.stack||[]).length&&history.state&&history.state.k){history.back()}else back()},
 pref:(k,v)=>{state.prefs=state.prefs||{};state.prefs[k]=k==='noInstall'?1:v},
 jOpen:()=>{state.ui.jOpen=!state.ui.jOpen},
 installApp:()=>{const e=window.__bip;if(!e)return;e.prompt();window.__bip=null;e.userChoice&&e.userChoice.then(()=>render())}
});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload()})})}
